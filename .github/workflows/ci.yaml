name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  collector:
    uses: locktivity/epack/.github/workflows/collector-ci.yaml@main
    with:
      name: google-workspace
      profile-url: ${{ vars.EVIDENCE_PROFILE_URL }}
      conformance-secrets: GOOGLE_SERVICE_ACCOUNT_JSON
      checks: |
        ./scripts/check-forbidden-data.sh
